<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survey App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .snippet-btn { background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; margin-right: 5px; margin-bottom: 5px; }
        .snippet-btn:active { background: var(--accent); }
        .btn-danger { background: #8b0000; color: white; border: none; }
    </style>
</head>
<body>
    <!-- ...Unchanged content before pdfTemplateCustomer... -->

    <div id="pdfTemplateCustomer"
         style="display: none; background: white; color: #222; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; width: 800px; padding: 40px;">
      <!-- PAGE 1: Cover -->
      <div class="pdf-page" style="page-break-after: always; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
        <img src="logo.jpg" alt="Logo" style="max-height: 100px; margin-bottom: 50px;" />
        <h1 style="color: #0F3759; font-size: 36px; letter-spacing: 1px; margin-bottom: 25px; text-align: center; font-weight: 700;">PREDESIGN SURVEY REPORT</h1>
        <div style="background: #f8f9fa; border-radius: 10px; padding: 30px 50px; margin-bottom: 50px; width: 60%; min-width: 300px; max-width: 400px;">
          <p style="margin: 0 0 15px 0; font-size: 16px;"><strong>Customer:</strong> <span class="bind-name"></span></p>
          <p style="margin: 0 0 15px 0; font-size: 16px;"><strong>Address:</strong> <span class="bind-address"></span></p>
          <p style="margin: 0; font-size: 16px;"><strong>Date:</strong> <span class="bind-date"></span></p>
        </div>
        <p style="color: #888; font-size: 14px; text-align: center;">A personal summary for your project</p>
      </div>

      <!-- PAGE 2: Main Survey Summary -->
      <div class="pdf-page" style="page-break-after: always; display: flex; flex-direction: column; align-items: center;">
        <img src="logo.jpg" alt="Logo" style="max-height: 80px; margin-bottom: 24px;" />
        <div style="width: 100%; max-width: 600px; background: #f8f9fa; border-radius: 10px; padding: 40px; box-sizing: border-box; text-align: center;">
          <p id="lp-greeting" style="margin-bottom: 22px; font-size: 16px;"></p>
          <p id="lp-size" style="margin-bottom: 22px; font-size: 16px;"></p>
          <p id="lp-roof" style="margin-bottom: 22px; font-size: 16px;"></p>
          <p id="lp-frame" style="margin-bottom: 22px; font-size: 16px;"></p>
          <p id="lp-compliance" style="margin-bottom: 22px; font-size: 16px;"></p>
          <p id="lp-revisit" style="margin-bottom: 36px; font-size: 16px;"></p>
          <div style="margin-top: 20px;">
            <p style="margin-bottom: 6px; color: #555;">Best regards,</p>
            <p id="lp-designer-name" style="margin: 0; font-weight: bold; color: #0F3759; font-size: 17px;"></p>
            <p style="margin: 0 0 0 0; color: #666; font-size: 15px;">Design Consultant</p>
            <p id="lp-designer-contact" style="margin: 12px 0 0 0; font-size: 14px; color: #888;"></p>
          </div>
        </div>
      </div>

      <!-- PAGE 3: Elevation Photo -->
      <div class="pdf-page" style="page-break-after: always; display: flex; flex-direction: column; align-items: center;">
        <img src="logo.jpg" alt="Logo" style="max-height: 80px; margin-bottom: 28px;" />
        <h2 style="color: #0F3759; font-size: 20px; margin-bottom: 20px;">Front Elevation</h2>
        <div style="width: 640px; height: 400px; background: #f8f9fa; border-radius: 10px; border: 1px solid #e2e2e2; display: flex; align-items: center; justify-content: center;">
          <img id="pdfImgCustomer-frontelevation" style="max-width: 100%; max-height: 100%; object-fit: contain;" />
        </div>
      </div>

      <!-- PAGE 4: Next Steps/Central Info Page -->
      <div class="pdf-page" style="page-break-after: always; display: flex; flex-direction: column; align-items: center;">
        <img src="logo.jpg" alt="Logo" style="max-height: 80px; margin-bottom: 24px;" />
        <div style="width: 100%; max-width: 600px; background: #f8f9fa; border-radius: 10px; padding: 32px; text-align: center;">
          <h2 style="color: #0F3759; font-size: 22px; margin-bottom: 24px; font-weight: 600;">Next Steps</h2>
          <p id="pdfDesignerBio" style="font-size: 15px; margin-bottom: 20px; color: #555;"></p>
          <div style="margin-top: 20px;">
            <p style="margin-bottom: 5px; font-weight: 500;">Your Designer: <span id="pdfDesignerName"></span></p>
            <p style="margin: 0; font-size: 14px;">Contact: <span id="pdfDesignerContact"></span></p>
          </div>
        </div>
      </div>

      <!-- You can use similar markup for any additional, conditional, or informational pages. -->

    </div>

    <!-- ...Unchanged content after pdfTemplateCustomer... -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
